name: VK LED Hostinger uptime guardian

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
    inputs:
      force_redeploy:
        description: "Run the recovery path even when production is healthy"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: vkled-hostinger-uptime-guardian
  cancel-in-progress: false

jobs:
  guard:
    name: Check and recover production
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Keep the public guardian schedule active
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          last_activity="$(gh api repos/${GITHUB_REPOSITORY}/commits --jq '.[0].commit.committer.date')"
          last_epoch="$(date -d "$last_activity" +%s)"
          now_epoch="$(date +%s)"
          if test "$((now_epoch - last_epoch))" -lt 2592000; then
            echo "Guardian repository activity is newer than 30 days."
            exit 0
          fi
          default_branch="$(gh api repos/${GITHUB_REPOSITORY} --jq '.default_branch')"
          head_sha="$(gh api repos/${GITHUB_REPOSITORY}/git/ref/heads/${default_branch} --jq '.object.sha')"
          tree_sha="$(gh api repos/${GITHUB_REPOSITORY}/git/commits/${head_sha} --jq '.tree.sha')"
          commit_sha="$(gh api --method POST repos/${GITHUB_REPOSITORY}/git/commits \
            -f message='chore(guardian): keep scheduled continuity active [skip ci]' \
            -f tree="$tree_sha" -F parents[]="$head_sha" --jq '.sha')"
          gh api --method PATCH repos/${GITHUB_REPOSITORY}/git/refs/heads/${default_branch} -f sha="$commit_sha" >/dev/null
          echo "Created a no-content monthly activity commit so GitHub does not disable the public schedule after 60 inactive days."

      - name: Probe production readiness
        id: probe
        env:
          FORCE_REDEPLOY: ${{ inputs.force_redeploy || false }}
        run: |
          if test "$FORCE_REDEPLOY" = "true"; then
            echo "A controlled recovery-path verification was requested."
            echo "healthy=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          healthy=false
          for attempt in 1 2 3 4 5 6 7 8; do
            response_file="$(mktemp)"
            probe_nonce="$(date +%s)-$attempt"
            http_status="$(curl --ipv4 --silent --show-error \
              --header 'Cache-Control: no-cache' \
              --connect-timeout 12 --max-time 25 \
              --output "$response_file" --write-out '%{http_code}' \
              "https://one.vkled.in/api/health?guardian=$probe_nonce" || true)"
            response="$(cat "$response_file")"
            if test "$http_status" = "200" && printf '%s' "$response" | jq -e \
              '.ok == true and .database == "connected" and .schema == "ready"' >/dev/null; then
              healthy=true
              printf 'Production is healthy on probe %s.\n' "$attempt"
              printf '%s\n' "$response"
              break
            fi
            printf 'Readiness probe %s/8 failed (HTTP %s).\n' "$attempt" "${http_status:-none}"
            sleep 15
          done
          echo "healthy=$healthy" >> "$GITHUB_OUTPUT"

      - name: Install the repository-scoped recovery key
        if: steps.probe.outputs.healthy != 'true'
        env:
          PRIVATE_REPO_DEPLOY_KEY: ${{ secrets.PRIVATE_REPO_DEPLOY_KEY }}
        run: |
          test -n "$PRIVATE_REPO_DEPLOY_KEY"
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$PRIVATE_REPO_DEPLOY_KEY" > "$HOME/.ssh/id_ed25519"
          chmod 600 "$HOME/.ssh/id_ed25519"
          ssh-keyscan -H github.com > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Trigger a bounded clean Hostinger redeploy
        if: steps.probe.outputs.healthy != 'true'
        id: redeploy
        run: |
          git clone --depth=1 git@github.com:vklightingindia/vkled-business-os.git private-source
          cd private-source
          revision="$(git rev-parse HEAD)"
          last_subject="$(git log -1 --pretty=%s)"
          last_epoch="$(git log -1 --pretty=%ct)"
          now_epoch="$(date +%s)"
          age_seconds="$((now_epoch - last_epoch))"

          if printf '%s' "$last_subject" | grep -q '^chore(continuity):' && test "$age_seconds" -lt 1200; then
            echo "A recovery deployment is already inside the 20-minute cooldown."
            echo "triggered=false" >> "$GITHUB_OUTPUT"
            echo "revision=$revision" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git config user.name "vkled-uptime-guardian"
          git config user.email "continuity@vkled.in"
          git commit --allow-empty -m "chore(continuity): recover Hostinger production [skip ci]"
          git push origin HEAD:main
          echo "triggered=true" >> "$GITHUB_OUTPUT"
          echo "revision=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Verify recovered production revision
        if: steps.probe.outputs.healthy != 'true'
        env:
          EXPECTED_REVISION: ${{ steps.redeploy.outputs.revision }}
        run: |
          test -n "$EXPECTED_REVISION"
          printf 'Waiting for production revision %s.\n' "$EXPECTED_REVISION"
          for attempt in $(seq 1 30); do
            response_file="$(mktemp)"
            probe_nonce="$(date +%s)-$attempt"
            http_status="$(curl --ipv4 --silent --show-error \
              --header 'Cache-Control: no-cache' \
              --connect-timeout 12 --max-time 25 \
              --output "$response_file" --write-out '%{http_code}' \
              "https://one.vkled.in/api/health?guardian=$probe_nonce" || true)"
            response="$(cat "$response_file")"
            printf 'Recovery verification %s/30 (HTTP %s).\n' "$attempt" "${http_status:-none}"
            if test "$http_status" = "200" && printf '%s' "$response" | jq -e \
              '.ok == true and .database == "connected" and .schema == "ready"' >/dev/null; then
              observed_revision="$(printf '%s' "$response" | jq -r '.buildRevision // "missing"')"
              printf '%s\n' "$response"
              printf '### Recovery verified\n\nProduction is live and ready on revision `%s` (recovery target `%s`).\n' \
                "$observed_revision" "$EXPECTED_REVISION" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            if test "$http_status" = "200"; then
              printf 'Observed revision: %s\n' \
                "$(printf '%s' "$response" | jq -r '.buildRevision // "missing"')"
            fi
            sleep 20
          done
          echo "Recovery deployment did not become ready inside the verification window."
          exit 1

      - name: Record healthy production
        if: steps.probe.outputs.healthy == 'true'
        run: |
          printf '%s\n' \
            '### VK LED production is healthy' \
            '' \
            'Hostinger, database and schema readiness passed. No deployment was created.' \
            >> "$GITHUB_STEP_SUMMARY"
